# Dependabot configuration — https://docs.github.com/code-security/dependabot
# Security updates (auto-PRs for known CVEs) are enabled separately in repo
# Settings and do NOT require this file. This file adds *scheduled version
# updates*: weekly PRs bumping deps to their latest versions, CVE or not.
#
# Note: mops (Motoko: core/json/sha2) has no Dependabot ecosystem, so those
# are not covered here — track them manually via `mops outdated`.
version: 2
updates:
  # Frontend / build tooling (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle dev/build tooling into one PR instead of several
      dev-tooling:
        patterns:
          - "vite"
          - "postcss"
          - "@types/*"

  # GitHub Actions (takes effect once CI workflows are added)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
